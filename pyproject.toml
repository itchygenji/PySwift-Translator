[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyswift-translator"
version = "0.1.1"
description = "AST-based Python to Swift source translator with a Swift compatibility runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PySwift contributors"}]
keywords = ["python", "swift", "transpiler", "translator", "compiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Swift",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pyswift = "pyswift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyswift = ["templates/*.swift"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["swift: integration tests requiring a Swift toolchain"]

[tool.ruff]
line-length = 100

[project.urls]
Homepage = "https://github.com/itchygenji/PySwift-Translator"
Repository = "https://github.com/itchygenji/PySwift-Translator"
Issues = "https://github.com/itchygenji/PySwift-Translator/issues"
